<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>课堂讨论室</title>
<style>
  /* ========== 基础 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --pink: #ec4899;
    --pink-deep: #db2777;
    --pink-soft: #fdf2f8;
    --pink-border: #fbcfe8;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #f5f6f8;
    --ok: #10b981;
    --warn: #f59e0b;
    --radius: 14px;
    --msg-size: 18px; /* 消息字号，可调 */
  }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; }
  textarea, input { font-family: inherit; outline: none; }

  /* ========== 进房页 ========== */
  #view-join {
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 45%, #ec4899 100%);
    overflow: auto; padding: 20px;
  }
  .join-card {
    width: 100%; max-width: 420px;
    background: rgba(255,255,255,.96);
    border-radius: 20px; padding: 32px 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,.25);
  }
  .join-card h1 { font-size: 26px; text-align: center; color: var(--ink); }
  .join-card .sub { text-align: center; color: var(--muted); font-size: 14px; margin: 8px 0 24px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .field input {
    width: 100%; padding: 12px 14px; font-size: 16px;
    border: 2px solid var(--line); border-radius: 10px; transition: border-color .15s;
  }
  .field input:focus { border-color: var(--pink); }
  .room-row { display: flex; gap: 8px; }
  .room-row input { flex: 1; min-width: 0; }
  .rnd-btn {
    flex: none; padding: 0 16px; border: 2px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--muted); font-weight: 600; font-size: 14px;
  }
  .rnd-btn:hover { border-color: var(--pink); color: var(--pink-deep); }
  .role-row { display: flex; gap: 10px; }
  .role-btn {
    flex: 1; padding: 11px 0; border-radius: 10px; font-size: 15px;
    border: 2px solid var(--line); background: #fff; color: var(--muted); font-weight: 600;
    transition: all .15s;
  }
  .role-btn.on { border-color: var(--pink); color: var(--pink-deep); background: var(--pink-soft); }
  #teacher-key-wrap { display: none; }
  #btn-join {
    width: 100%; margin-top: 8px; padding: 14px 0;
    background: linear-gradient(90deg, var(--pink), var(--pink-deep));
    color: #fff; font-size: 17px; font-weight: 700; border-radius: 12px;
    box-shadow: 0 6px 16px rgba(236,72,153,.4);
    transition: transform .1s;
  }
  #btn-join:active { transform: scale(.97); }
  .join-tip { margin-top: 16px; font-size: 12px; color: #9ca3af; text-align: center; line-height: 1.6; }
  .join-err { color: #dc2626; font-size: 13px; text-align: center; min-height: 18px; margin-top: 8px; }

  /* ========== 讨论页框架 ========== */
  #view-room { display: none; height: 100%; flex-direction: column; }

  /* 顶栏 */
  #topbar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line);
    overflow-x: auto; white-space: nowrap; scrollbar-width: none;
  }
  #topbar::-webkit-scrollbar { display: none; }
  .tb-room {
    font-weight: 800; font-size: 18px; color: var(--pink-deep);
    letter-spacing: 1px; flex: none;
  }
  .tb-room small { font-size: 11px; color: var(--muted); font-weight: 400; letter-spacing: 0; display: block; line-height: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: #ef4444; }
  .tb-members {
    flex: none; font-size: 13px; color: var(--muted); cursor: pointer;
    padding: 4px 8px; border-radius: 8px;
  }
  .tb-members:hover { background: var(--bg); }
  .tb-spacer { flex: 1; }
  .tb-btn {
    flex: none; padding: 6px 10px; font-size: 13px; border-radius: 8px;
    background: var(--bg); color: var(--ink); font-weight: 600;
  }
  .tb-btn:active { background: var(--line); }
  .tb-btn.on { background: var(--pink-soft); color: var(--pink-deep); }
  .fs-group { flex: none; display: flex; align-items: center; gap: 4px; }
  .fs-btn {
    width: 32px; height: 30px; border-radius: 8px; background: var(--bg);
    font-weight: 800; font-size: 14px; color: var(--ink);
  }
  #fs-reset { width: auto; padding: 0 8px; font-size: 12px; font-weight: 600; }

  /* 成员名单浮层 */
  #member-pop {
    display: none; position: fixed; top: 52px; left: 12px; z-index: 60;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15); padding: 10px 14px;
    max-width: 70vw; max-height: 50vh; overflow: auto;
  }
  #member-pop h4 { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  #member-pop .mrow { font-size: 14px; padding: 3px 0; }
  #member-pop .mrow.is-t { color: var(--pink-deep); font-weight: 700; }

  /* 公告区 */
  #notice-bar {
    flex: none; background: linear-gradient(90deg, #fff7ed, #fef3c7);
    border-bottom: 1px solid #fde68a; padding: 8px 14px;
    display: none; align-items: flex-start; gap: 8px;
  }
  #notice-bar.show { display: flex; }
  #notice-bar .n-tag {
    flex: none; background: var(--warn); color: #fff; font-size: 12px; font-weight: 700;
    border-radius: 6px; padding: 2px 7px; margin-top: 2px;
  }
  #notice-text { flex: 1; font-size: var(--msg-size); line-height: 1.55; white-space: pre-wrap; word-break: break-word; font-weight: 600; }
  #notice-fold { flex: none; background: none; color: var(--muted); font-size: 12px; padding: 4px; }
  #notice-bar.folded #notice-text { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

  /* 教师公告编辑 */
  #notice-edit {
    flex: none; display: none; gap: 8px; padding: 8px 12px;
    background: #fffbeb; border-bottom: 1px solid #fde68a;
  }
  #notice-edit.show { display: flex; }
  #notice-input {
    flex: 1; resize: none; border: 2px solid #fde68a; border-radius: 10px;
    padding: 8px 10px; font-size: var(--msg-size); min-height: 40px; max-height: 160px; background: #fff;
  }
  #notice-input:focus { border-color: var(--warn); }
  .ne-col { display: flex; flex-direction: column; gap: 6px; }
  .ne-wrap { flex: 1; position: relative; display: flex; }
  .ne-btn {
    padding: 8px 14px; border-radius: 9px; font-size: 14px; font-weight: 700;
    background: var(--warn); color: #fff;
  }
  .ne-btn.gray { background: var(--line); color: var(--muted); }
  /* 公告实时预览条：显示含行内着色 / 整条着色的公告效果 */
  #n-preview {
    flex: none; display: none; padding: 6px 12px;
    background: #fffbeb; border-bottom: 1px solid #fde68a;
    font-size: var(--msg-size); line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; max-height: 88px; overflow: auto;
  }
  #n-preview.show { display: block; }

  /* 消息流 */
  #msg-wrap { flex: 1; position: relative; overflow: hidden; }
  #msg-list {
    height: 100%; overflow-y: auto; padding: 12px 14px 20px;
    scroll-behavior: smooth;
  }
  .msg { display: flex; gap: 8px; margin-bottom: 12px; align-items: flex-start; }
  .msg.mine { flex-direction: row-reverse; }
  .avatar {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, #64748b, #475569);
    margin-top: 2px; user-select: none;
  }
  .msg.is-t .avatar { background: linear-gradient(135deg, var(--pink), var(--pink-deep)); }
  .bubble-col { max-width: 78%; display: flex; flex-direction: column; }
  .msg.mine .bubble-col { align-items: flex-end; }
  .meta { font-size: 12px; color: var(--muted); margin: 0 4px 3px; display: flex; gap: 6px; align-items: center; }
  .badge-t {
    background: var(--pink); color: #fff; font-size: 11px; font-weight: 700;
    border-radius: 4px; padding: 1px 5px;
  }
  .badge-q { background: #ffedd5; color: #c2410c; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 5px; }
  .badge-a { background: #dcfce7; color: #15803d; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 5px; }
  .bubble {
    position: relative; background: #fff; border: 1px solid var(--line);
    border-radius: 4px 14px 14px 14px; padding: 9px 13px;
    font-size: var(--msg-size); line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.mine .bubble { background: var(--pink-soft); border-color: var(--pink-border); border-radius: 14px 4px 14px 14px; }
  .msg.is-t .bubble { background: #fdf2f8; border-color: var(--pink-border); border-radius: 4px 14px 14px 14px; }
  .msg.is-q .bubble { border-left: 4px solid #f97316; }
  .msg.is-a .bubble { border-left: 4px solid #10b981; }
  .sysmsg { text-align: center; font-size: 12px; color: #9ca3af; margin: 10px 0; }

  /* 文件卡片 */
  .file-card {
    display: flex; align-items: center; gap: 10px; min-width: 220px; max-width: 100%;
  }
  .file-ico {
    flex: none; width: 40px; height: 40px; border-radius: 10px;
    background: #eff6ff; color: #2563eb;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .file-info { flex: 1; min-width: 0; }
  .file-name { font-size: 14px; font-weight: 600; word-break: break-all; line-height: 1.4; }
  .file-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .fbtn {
    flex: none; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 700;
    background: #2563eb; color: #fff; text-decoration: none;
  }
  .fbtn:active { opacity: .85; }
  .fdel {
    flex: none; padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 600;
    background: #fee2e2; color: #dc2626;
  }
  .fprog { width: 100%; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .fprog em { display: block; height: 100%; width: 0; background: var(--pink); border-radius: 999px; transition: width .2s; }
  #btn-file {
    flex: none; width: 38px; height: 38px; border-radius: 12px; font-size: 19px;
    background: var(--bg); color: var(--ink); margin-bottom: 2px;
  }
  #btn-file:active { background: var(--line); }

  /* 教师消息操作按钮：上屏 / 复制 / 发送到编辑框（悬停或点击消息显示） */
  .msg-acts { display: none; flex: none; align-self: center; flex-direction: column; gap: 6px; }
  .msg-acts button {
    font-size: 12px; color: var(--warn); background: #fffbeb;
    border: 1px solid #fde68a; border-radius: 8px; padding: 4px 8px; font-weight: 600;
  }
  .msg-acts .copy-btn, .msg-acts .fwd-btn { color: #2563eb; background: #eff6ff; border-color: #bfdbfe; }
  body.is-teacher .msg:not(.mine):hover .msg-acts,
  body.is-teacher .msg:not(.mine).acts-on .msg-acts { display: flex; }
  body.is-teacher .msg:not(.mine):hover,
  body.is-teacher .msg:not(.mine).acts-on { background: #fafafa; border-radius: 10px; }

  /* 回到底部 */
  #btn-bottom {
    display: none; position: absolute; right: 16px; bottom: 16px; z-index: 20;
    width: 40px; height: 40px; border-radius: 50%;
    background: #fff; border: 1px solid var(--line);
    box-shadow: 0 4px 14px rgba(0,0,0,.15);
    font-size: 18px; color: var(--pink-deep); font-weight: 800;
  }
  #btn-bottom.show { display: block; }

  /* 断线提示 */
  #conn-tip {
    display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 30; background: #ef4444; color: #fff; font-size: 13px; font-weight: 600;
    padding: 6px 16px; border-radius: 999px; box-shadow: 0 4px 12px rgba(239,68,68,.4);
  }
  #conn-tip.show { display: block; }

  /* 输入区 */
  #input-bar {
    flex: none; background: #fff; border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .type-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .type-btn {
    padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
    border: 1.5px solid var(--line); background: #fff; color: var(--muted);
  }
  .type-btn.on-q { border-color: #f97316; color: #c2410c; background: #fff7ed; }
  .type-btn.on-a { border-color: #10b981; color: #15803d; background: #f0fdf4; }
  .type-btn.mini { color: #9ca3af; border-style: dashed; }
  .char-count { margin-left: auto; font-size: 12px; color: #9ca3af; }
  .input-row { display: flex; gap: 8px; align-items: flex-end; position: relative; }
  /* 实时预览条：显示含行内着色 / 整条着色的发送效果，与消息气泡同样的富文本渲染 */
  #input-preview {
    display: none; padding: 6px 12px; margin-bottom: 8px;
    background: var(--pink-soft); border: 1px dashed var(--pink-border); border-radius: 10px;
    font-size: var(--msg-size); line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; max-height: 88px; overflow: auto;
  }
  #input-preview.show { display: block; }
  /* 富文本：表情/颜色按钮与浮层 */
  .icon-btn {
    flex: none; width: 38px; height: 46px; border-radius: 12px;
    background: var(--bg); font-size: 19px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { background: var(--pink-soft); }
  .icon-btn .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); background: #fff; }
  .icon-btn.on-color .dot { border-color: var(--pink); }
  .composer-pop {
    display: none; position: absolute; bottom: calc(100% + 8px); left: 0; z-index: 70;
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 12px 32px rgba(0,0,0,.18); padding: 10px;
  }
  .composer-pop.show { display: block; }
  .pop-hint { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .emoji-grid { display: grid; grid-template-columns: repeat(8, 32px); gap: 4px; }
  .emoji-item { width: 32px; height: 32px; font-size: 19px; border-radius: 8px; background: none; }
  .emoji-item:active { background: var(--pink-soft); }
  .sw-row { display: flex; gap: 8px; align-items: center; }
  .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
  .sw.def { background: #fff; }
  .sw:active { transform: scale(1.12); }
  /* 图片气泡 */
  .img-bubble {
    background: #fff; border: 1px solid var(--line); border-radius: 4px 14px 14px 14px;
    padding: 6px; max-width: min(280px, 100%);
  }
  .msg.mine .img-bubble { background: var(--pink-soft); border-color: var(--pink-border); border-radius: 14px 4px 14px 14px; }
  .msg.is-t .img-bubble { background: #fdf2f8; border-color: var(--pink-border); }
  .img-bubble img { display: block; max-width: 100%; max-height: 260px; border-radius: 10px; cursor: zoom-in; }
  /* 图片全屏预览（Lightbox）：遮罩 + 居中大图，滚轮/捏合缩放，拖动平移 */
  #lightbox {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(15, 23, 42, .9);
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #lightbox[hidden] { display: none; }
  #lb-img {
    max-width: 92vw; max-height: 88vh;
    transform-origin: center center;
    user-select: none; -webkit-user-drag: none;
    border-radius: 6px; box-shadow: 0 8px 40px rgba(0, 0, 0, .5);
  }
  .lb-bar {
    position: absolute; top: 10px; right: 12px;
    display: flex; gap: 4px; align-items: center;
    background: rgba(255, 255, 255, .94); border-radius: 10px; padding: 5px 8px;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .3);
  }
  .lb-pct { font-size: 12px; color: #64748b; min-width: 40px; text-align: center; font-weight: 600; }
  .lb-btn {
    width: 30px; height: 30px; border: none; border-radius: 8px; background: transparent;
    color: #334155; display: flex; align-items: center; justify-content: center; cursor: pointer;
    text-decoration: none; font-size: 12px; font-weight: 700;
  }
  .lb-btn:hover { background: var(--pink-soft); color: var(--pink-deep); }
  .img-cap { font-size: var(--msg-size); line-height: 1.5; padding: 6px 4px 2px; white-space: pre-wrap; word-break: break-word; }
  .img-up { font-size: 14px; padding: 4px 2px; }
  #msg-input {
    flex: 1; resize: none; border: 2px solid var(--line); border-radius: 12px;
    padding: 10px 12px; font-size: 16px; line-height: 1.5;
    min-height: 46px; max-height: 130px; background: var(--bg);
    transition: border-color .15s;
  }
  #msg-input:focus { border-color: var(--pink); background: #fff; }
  #btn-send {
    flex: none; padding: 12px 22px; border-radius: 12px;
    background: linear-gradient(90deg, var(--pink), var(--pink-deep));
    color: #fff; font-size: 16px; font-weight: 700;
    box-shadow: 0 4px 12px rgba(236,72,153,.35);
  }
  #btn-send:disabled { opacity: .5; box-shadow: none; }

  /* 设置弹层 */
  #settings-mask {
    display: none; position: fixed; inset: 0; z-index: 80;
    background: rgba(0,0,0,.35);
    align-items: center; justify-content: center; padding: 20px;
  }
  #settings-mask.show { display: flex; }
  .settings-card {
    width: 100%; max-width: 420px; background: #fff; border-radius: 16px; padding: 20px;
    max-height: 80vh; overflow: auto;
  }
  .settings-card h3 { font-size: 17px; margin-bottom: 14px; }
  .settings-card textarea {
    width: 100%; min-height: 70px; border: 2px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font-size: 14px; resize: vertical;
  }
  .settings-row { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; }
  .settings-row span { font-size: 14px; }
  .settings-tip { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
  .st-actions { display: flex; gap: 10px; margin-top: 14px; }
  .st-actions button {
    flex: 1; padding: 11px 0; border-radius: 10px; font-size: 15px; font-weight: 700;
  }
  #st-save { background: var(--pink); color: #fff; }
  #st-cancel { background: var(--bg); color: var(--muted); }
  .switch { position: relative; width: 44px; height: 24px; }
  .switch input { display: none; }
  .switch em {
    position: absolute; inset: 0; border-radius: 999px; background: #d1d5db; transition: .2s;
  }
  .switch em::after {
    content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; transition: .2s;
  }
  .switch input:checked + em { background: var(--pink); }
  .switch input:checked + em::after { transform: translateX(20px); }

  /* Toast */
  #toast {
    position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%);
    background: rgba(31,41,55,.9); color: #fff; font-size: 14px;
    padding: 8px 18px; border-radius: 999px; z-index: 99;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }

  /* 手机窄屏 */
  @media (max-width: 520px) {
    .bubble-col { max-width: 86%; }
    .tb-room { font-size: 16px; }
  }
</style>
</head>
<body>

<!-- ================= 进房页 ================= -->
<div id="view-join">
  <div class="join-card">
    <h1>课堂讨论室</h1>
    <p class="sub">输入房间号，和全班同学实时讨论</p>
    <div class="field">
      <label>房间号（5 位字母或数字，全班统一）</label>
      <div class="room-row">
        <input id="in-room" maxlength="5" placeholder="例如：a1b2c" autocapitalize="characters" autocomplete="off">
        <button class="rnd-btn" id="btn-rand-room" type="button" title="随机生成一个合格房间号">随机</button>
      </div>
    </div>
    <div class="field">
      <label>你的名字</label>
      <input id="in-name" maxlength="12" placeholder="例如：张三" autocomplete="off">
    </div>
    <div class="field">
      <label>身份</label>
      <div class="role-row">
        <button class="role-btn on" id="role-student" type="button">学生</button>
        <button class="role-btn" id="role-teacher" type="button">教师</button>

}

}

/* 复制到系统剪贴板（clipboard API 优先，execCommand 兜底） */

function fallbackCopy(t) {

/* ---------- 富文本辅助（表情面板 / 颜色面板） ---------- */
var EMOJIS = ["👍","❤️","😂","🎉","🤔","👏","🙏","🔥","✅","❌","❓","💡","⚠️","😊","😅","🥰","😭","🤝","🙋","🌟","⚡","🎯","💯","📚"];

function insertAtCursor(inp, t) {
  var st = inp.selectionStart == null ? inp.value.length : inp.selectionStart;

  var pos = st + t.length;

/* 选区着色：用行内颜色标记包裹选中文本；无选中返回 false（调用方回落为整条消息一色） */
function insertWrap(inp, color) {
  var st = inp.selectionStart, en = inp.selectionEnd;
  if (st == null || st === en) return false;
  var wrapped = "\u200bC" + color + "\u200b" + inp.value.slice(st, en) + "\u200b/C\u200b";
  inp.value = inp.value.slice(0, st) + wrapped + inp.value.slice(en);
  inp.setSelectionRange(st + wrapped.length, st + wrapped.length);
  return true;
}
function setDot(btn, c) {

  if (c) { btn.style.background = c; btn.classList.add("on-color"); }
  else { btn.style.background = ""; btn.classList.remove("on-color"); }
}
function isTeacherName(n) { return typeof n === "string" && n.indexOf(TEACHER_MARK) === 0; }
function displayName(n) { return isTeacherName(n) ? n.slice(1) : n; }
function stripMark(t) {
  return t.replace(/\u200b[QAH]\u200b/g, "").replace(/\u200bC#[0-9a-fA-F]{6}\u200b/g, "").replace(/\u200b\/C\u200b/g, "");
}
/* 渲染富文本标记：先整体转义，再把包裹标记替换为白名单 span（色值来自正则捕获，安全）；剥除残留未配对标记防露码 */
function renderRich(t) {
  var s = esc(String(t == null ? "" : t));
  s = s.replace(/\u200bC#([0-9a-fA-F]{6})\u200b([\s\S]*?)\u200b\/C\u200b/g, '<span style="color:#$1">$2</span>');
  s = s.replace(/\u200bC#[0-9a-fA-F]{6}\u200b/g, "").replace(/\u200b\/C\u200b/g, "");
  return s;
}
/* CSS 颜色值 → 6 位 hex（仅支持 #hex 与 rgb()，不支持返回 ""） */
function parseColor(s) {
  if (!s) return "";

  var m = s.match(/^#([0-9a-f]{6})$/);
  if (m) return m[1];
  m = s.match(/^rgb\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)$/);
  if (m) {
    var hex = function (v) { var h = Number(v).toString(16); return h.length < 2 ? "0" + h : h; };
    return hex(m[1]) + hex(m[2]) + hex(m[3]);
  }
  return "";
}
/* 从剪贴板 text/html 提取颜色转为包裹标记（粗斜体等样式本期降级纯文本）；无 html 或解析失败返回 null，走默认粘贴 */
function htmlToMarks(html) {
  try {
    var doc = new DOMParser().parseFromString(html, "text/html");
    var out = "";
    (function walk(node, color) {
      for (var n = node.firstChild; n; n = n.nextSibling) {
        if (n.nodeType === 3) {
          var v = n.nodeValue;
          out += color && v ? ("\u200bC" + color + "\u200b" + v + "\u200b/C\u200b") : v;
        } else if (n.nodeType === 1) {
          if (n.tagName === "BR") { out += "\n"; continue; }
          if (n.tagName === "SCRIPT" || n.tagName === "STYLE") continue;
          var c = color, st = n.style && n.style.color ? n.style.color : "";
          if (!st && n.tagName === "FONT" && n.getAttribute("color")) st = n.getAttribute("color");
          var p = parseColor(st);
          if (p) c = "#" + p;
          walk(n, c);
        }
      }
    })(doc.body, "");
    return out.replace(/\n{3,}/g, "\n\n");
  } catch (e) { return null; }
}
/* 输入框实时预览条：内容含行内标记或设了整条色时，显示发送后的渲染效果 */
function updatePreview() {
  var pv = $("input-preview");

  if (!v || (!/\u200bC#[0-9a-fA-F]{6}\u200b/.test(v) && !S.msgColor)) {

  pv.classList.add("show");
}

function updateNoticePreview() {

/* 随机生成 5 位合格房间号：避开易混淆字符（0/O、1/I/L），便于课堂口头传达 */
function randRoom() {
  var cs = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";

  for (var i = 0; i < 5; i++) r += cs.charAt(Math.floor(Math.random() * cs.length));

}
function rand16() {
  var s = "abcdefghijklmnopqrstuvwxyz0123456789", r = "";
  for (var i = 0; i < 16; i++) r += s.charAt(Math.floor(Math.random() * s.length));
  return r;
}

  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
  return (n / 1073741824).toFixed(2) + " GB";
}

function saveLS() {
  try {
    localStorage.setItem("cr_font", String(S.fontSize));
    localStorage.setItem("cr_words", S.words);
    localStorage.setItem("cr_filter", S.filterOn ? "1" : "0");
  } catch (e) {}
}
/* 敏感词过滤（只作用于发送内容） */
function applyFilter(t) {
  if (!S.filterOn || !S.words) return t;
  var list = S.words.split(/[,，、\s]+/).filter(function (w) { return w.length > 0; });
  for (var i = 0; i < list.length; i++) {
    var w = list[i];
    while (t.indexOf(w) >= 0) t = t.replace(w, "**");
  }
  return t;
}

/* ---------- 消息存储 ---------- */
function loadHistory() {
  try {
    var raw = localStorage.getItem("cr_msg_" + S.room);
    if (raw) S.msgs = JSON.parse(raw) || [];
    for (var i = 0; i < S.msgs.length; i++) {
      if (S.msgs[i].type === "file" || S.msgs[i].type === "image") S.msgs[i].uploading = false; // 上传中途退出的残留状态
    }
    var n = localStorage.getItem("cr_notice_" + S.room);
    if (n) S.notice = n;
  } catch (e) { S.msgs = []; }
}
function saveHistory() {
  try {
    if (S.msgs.length > MAX_KEEP) S.msgs = S.msgs.slice(-MAX_KEEP);
    localStorage.setItem("cr_msg_" + S.room, JSON.stringify(S.msgs));
    localStorage.setItem("cr_notice_" + S.room, S.notice || "");
  } catch (e) {}
}

/* ---------- WebSocket ---------- */
function connect() {
  if (S.ws && (S.ws.readyState === 0 || S.ws.readyState === 1)) return;
  updateDot();
  var ws;
  try { ws = new WebSocket(WS_HOST + encodeURIComponent(S.room) + "/websocket"); }
  catch (e) { scheduleRetry(); return; }
  S.ws = ws;

  ws.onopen = function () {
    S.wsOk = true; S.retry = 0;
    ws.send(JSON.stringify({ type: "name", data: S.name }));
    updateDot();
  };
  ws.onmessage = function (e) {
    var m;
    try { m = JSON.parse(e.data); } catch (err) { return; }
    handleServerMsg(m);
  };
  ws.onclose = function () {
    S.wsOk = false; S.ws = null;
    updateDot();
    if (!S.closedByUser) scheduleRetry();
  };
  ws.onerror = function () { /* onclose 会接手 */ };
}
function scheduleRetry() {
  if (S.retryTimer || S.closedByUser) return;
  var delay = Math.min(30000, 2000 * Math.pow(2, S.retry++));
  $("conn-tip").textContent = "连接已断开，" + Math.round(delay / 1000) + " 秒后重连…";
  $("conn-tip").classList.add("show");
  S.retryTimer = setTimeout(function () {
    S.retryTimer = null;
    $("conn-tip").classList.remove("show");
    connect();
  }, delay);
}
function updateDot() {
  var d = $("conn-dot");
  d.className = "dot" + (S.wsOk ? " ok" : (S.ws ? "" : " bad"));
}
function safeSend(obj) {
  if (S.ws && S.ws.readyState === 1) {
    S.ws.send(JSON.stringify(obj));
    return true;
  }
  toast("尚未连上服务器，稍候自动重试");
  return false;
}

/* ---------- 服务器消息分发 ---------- */
function handleServerMsg(m) {
  if (m.type === "joined") {
    if (m.data && !S.members[m.data]) {
      S.members[m.data] = true;
      renderMembers();
      if (m.data !== S.name) addSysMsg(displayName(m.data) + (isTeacherName(m.data) ? "（老师）" : "") + " 加入了讨论");
      maybeReplayNotice(m.data);
      maybeReplayFiles(m.data);
    }
  } else if (m.type === "ready") {
    if (m.data && Array.isArray(m.data.fileList)) syncFiles(m.data.fileList); // 房间现有文件（迟到者回放）
    addSysMsg("已连接。注意：新加入看不到之前的消息，请看顶部公告");
  } else if (m.type === "quit") {
    var qn = typeof m.data === "string" ? m.data : (m.data && m.data.name);
    if (qn && S.members[qn]) {
      delete S.members[qn];
      renderMembers();
      addSysMsg(displayName(qn) + (isTeacherName(qn) ? "（老师）" : "") + " 离开了讨论");
    }
  } else if (m.type === "message") {
    if (!m.data || typeof m.data.message !== "string") return;
    var raw = m.data.message;
    var name = m.data.name || "匿名";
    var time = m.data.time || Date.now();

    /* 教师公告（可携带 \u200bC#rrggbb\u200b 颜色前缀） */
    if (raw.indexOf(MARK_A) === 0) {
      if (!isTeacherName(name)) return;         // 非教师发的公告标记直接丢弃
      var nc = "";
      var t2 = raw.slice(MARK_A.length);
      /* 先 stash 包裹标记，防止公告内容里的选区着色被当作整条前缀误剥 */
      var nstash = [];
      t2 = t2.replace(/\u200bC#([0-9a-fA-F]{6})\u200b([\s\S]*?)\u200b\/C\u200b/g, function (m0) {
        nstash.push(m0); return "\u0001" + (nstash.length - 1) + "\u0001";
      });
      t2 = t2.replace(/\u200bC#([0-9a-fA-F]{6})\u200b/, function (_, c) { nc = "#" + c; return ""; });
      if (nstash.length) t2 = t2.replace(/\u0001(\d+)\u0001/g, function (_, i) { return nstash[+i]; });
      var fresh = t2;                           // 公告保留行内包裹标记，渲染时转富文本
      if (!stripMark(fresh).trim()) fresh = ""; // 实际内容为空视为撤下
      var changed = fresh !== S.notice || nc !== (S.noticeColor || "");
      S.notice = fresh;
      S.noticeColor = nc;
      renderNotice(changed);                    // 内容相同（如教师重发）不重复弹提示
      return;
    }
    /* 普通消息 / 提问 / 回答 / 图片（均可携带颜色前缀） */
    /* 先 stash 行内包裹标记为占位符：包裹开始符与整条颜色前缀格式相同，
       不保护会被下面的前缀剥除误吞，导致接收端丢色 + 与本机回显去重失败（双条消息） */
    var stash = [];
    var raw0 = raw.replace(/\u200bC#([0-9a-fA-F]{6})\u200b([\s\S]*?)\u200b\/C\u200b/g, function (m0) {
      stash.push(m0); return "\u0001" + (stash.length - 1) + "\u0001";
    });
    var color = "";
    var raw2 = raw0.replace(/^\u200bC#([0-9a-fA-F]{6})\u200b/, function (_, c) { color = "#" + c; return ""; });
    if (stash.length) raw2 = raw2.replace(/\u0001(\d+)\u0001/g, function (_, i) { return stash[+i]; });
    if (raw2.indexOf(MARK_IMG) === 0) {
      /* 图片消息：\u200bIMG\u200buid\u200benc文件名\u200b正文 */
      var pp = raw2.split("\u200b");
      var iuid = (pp[2] || "").toLowerCase();
      if (!/^[a-z0-9]{16}$/.test(iuid)) return; // uid 白名单，杜绝注入
      var icap = stripMark(pp.slice(4).join("\u200b"));
      pushMsg({
        name: name, text: icap, time: time, type: "image", color: color,
        file: { id: iuid, name: decodeURIComponent(pp[3] || "图片.jpg"), size: 0, uid: iuid } // id=uid 与发送端占位一致，去重防双图
      });
      return;
    }
    var type = raw2.indexOf(MARK_Q) === 0 ? "question" : (raw2.indexOf(MARK_H) === 0 ? "answer" : "normal");
    var text = raw2.replace(/\u200b[QAH]\u200b/g, "");          // 剥类型标记，保留行内颜色包裹标记供渲染
    if (!stripMark(text).trim()) return;
    pushMsg({ name: name, text: text, time: time, type: type, color: color });
  } else if (m.type === "addFile") {
    var f = m.data;
    if (f && f.id && f.name) pushMsg(fileToMsg(f));
  } else if (m.type === "addFiles") {
    if (Array.isArray(m.data)) syncFiles(m.data);
  } else if (m.type === "fileList") {
    /* 服务器把 addFile/addFiles 统一转成 fileList（全量列表）广播，含发送者本人 */
    if (Array.isArray(m.data)) syncFiles(m.data);
  } else if (m.type === "removeFile") {
    var rid = m.data && m.data.id;
    if (rid) removeFileCard(rid);
  }
}
/* 服务器文件对象 → 本地消息对象 */
function fileToMsg(f) {
  return {
    type: "file", time: Date.now(),
    name: f.username || "匿名",
    file: { id: f.id, name: f.name, size: f.size || 0, uid: f.uid }
  };
}
/* 房间文件列表对账：新增的入列；消失的延迟 2 秒确认后才撤卡
   （教师重发文件列表时会先 removeFile 再 addFiles，立即撤卡会导致闪烁） */
var fileRemoveTimers = {};
function syncFiles(list) {
  var ids = {};
  for (var i = 0; i < list.length; i++) {
    var f = list[i];
    if (f && f.id && f.name) {
      ids[f.id] = true;
      S.fileCache[f.id] = { id: f.id, name: f.name, size: f.size || 0, uid: f.uid, username: f.username || "匿名" };
      if (fileRemoveTimers[f.id]) { clearTimeout(fileRemoveTimers[f.id]); delete fileRemoveTimers[f.id]; }
      pushMsg(fileToMsg(f), false);
    }
  }
  for (var j = S.msgs.length - 1; j >= 0; j--) {
    var m = S.msgs[j];
    if (m.type === "file" && !m.uploading && !ids[m.file.id]) scheduleFileRemove(m.file.id);
  }
}
function scheduleFileRemove(id) {
  if (fileRemoveTimers[id]) return;
  fileRemoveTimers[id] = setTimeout(function () {
    delete fileRemoveTimers[id];
    removeFileCard(id);
  }, 2000);
}
/* 关键机制：服务器不向迟到者回放文件列表，且 addFiles 不按 id 去重
   （列表会累积重复条目，客户端按 id 去重显示即可）。
   注意不能用 removeFile 清理旧条目：removeFile 是真删除，会把 s45 上的
   文件一并删掉（实测重发后 404）。所以教师端看到新成员加入后，
   直接整体 addFiles 重发一次，迟到者约 1.2 秒后即可看到全部文件。
   同一成员只触发一次。 */
function maybeReplayFiles(name) {
  if (!S.isTeacher || S.fileReplayedTo[name]) return;
  var list = [];
  for (var id in S.fileCache) list.push(S.fileCache[id]);
  if (!list.length) return;
  S.fileReplayedTo[name] = true;
  setTimeout(function () {
    if (S.ws && S.ws.readyState === 1) {
      safeSend({ type: "addFiles", data: list });
    }
  }, 1200);
}
/* 撤下文件：从历史与消息流中移除 */
function removeFileCard(id) {
  delete S.fileCache[id];
  for (var i = 0; i < S.msgs.length; i++) {
    if ((S.msgs[i].type === "file" || S.msgs[i].type === "image") && S.msgs[i].file && S.msgs[i].file.id === id) {
      S.msgs.splice(i, 1);
      saveHistory();
      break;
    }
  }
  var el = $("msg-list").querySelector('.msg[data-fid="' + id + '"]');
  if (el) el.parentNode.removeChild(el);
}

/* ---------- 消息渲染 ---------- */
function pushMsg(msg, skipSave) {
  /* 去重：文件/图片按 file.id 全量查（fileList 全量广播会反复携带旧文件；
     图片的发送端占位与服务器 echo 用同一 uid 对齐，防发送端双图）；
     文本按 同名 + 同毫秒 + 同内容，查最近 8 条 */
  var i, o;
  if ((msg.type === "file" || msg.type === "image") && msg.file) {
    for (i = 0; i < S.msgs.length; i++) {
      if ((S.msgs[i].type === "file" || S.msgs[i].type === "image") && S.msgs[i].file && S.msgs[i].file.id === msg.file.id) return;
    }
  } else {
    var key = msg.name + "|" + msg.time + "|" + msg.text;
    for (i = Math.max(0, S.msgs.length - 8); i < S.msgs.length; i++) {
      o = S.msgs[i];
      if (o.type !== "file" && o.name + "|" + o.time + "|" + o.text === key) return;
    }
  }
  S.msgs.push(msg);
  if (!skipSave) saveHistory();
  renderMsg(msg);
}
function renderMsg(msg) {
  /* mine 按发送者名字实时判断，不信任历史记录里的标记
     （教师端/学生端页面在同一浏览器共用 localStorage 历史，存的 mine 会互相污染） */
  var mine = msg.name === S.name;
  var isT = isTeacherName(msg.name);
  if (S.onlyQ && !((isT && msg.type === "question") || msg.type === "answer")) { applyOnlyQFilter(); return; }
  var list = $("msg-list");
  var div = document.createElement("div");
  div.className = "msg" + (isT ? " is-t" : "") +
                  (mine ? " mine" : "") + (msg.type === "question" ? " is-q" : "") +
                  (msg.type === "answer" ? " is-a" : "");
  if ((msg.type === "file" || msg.type === "image") && msg.file) div.setAttribute("data-fid", msg.file.id);
  var initial = displayName(msg.name).slice(0, 1) || "?";
  var icoSvg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
  var body;
  if (msg.type === "file") {
    body = fileCardHtml(msg.file, msg.uploading, icoSvg);
  } else if (msg.type === "image") {
    body = imageBubbleHtml(msg);
  } else {
    body = '<div class="bubble"' + (msg.color ? ' style="color:' + msg.color + '"' : "") + ">" + renderRich(msg.text) + "</div>";
  }
  var html =
    '<div class="avatar">' + esc(initial) + "</div>" +
    '<div class="bubble-col">' +
      '<div class="meta">' +
        (isT ? '<span class="badge-t">师</span>' : "") +
        "<span>" + esc(displayName(msg.name)) + (mine ? "（我）" : "") + "</span>" +
        (msg.type === "question" ? '<span class="badge-q">问</span>' : "") +
        (msg.type === "answer" ? '<span class="badge-a">答</span>' : "") +
        "<span>" + hhmm(msg.time) + "</span>" +
      "</div>" + body +
    "</div>" +
    (msg.type === "file" || msg.type === "image" ? "" :
      '<span class="msg-acts">' +
        '<button class="pin-btn" type="button">上屏</button>' +
        '<button class="copy-btn" type="button">复制</button>' +
        '<button class="fwd-btn" type="button">发送</button>' +
      "</span>");
  div.innerHTML = html;

  /* 教师消息操作：上屏 / 复制 / 发送到编辑框（悬停或点击消息显示，点击别处不自动收起） */
  var acts = div.querySelector(".msg-acts");
  if (acts) {
    acts.addEventListener("click", function (e) { e.stopPropagation(); });
    acts.querySelector(".pin-btn").onclick = function () {
      pinToScreen(displayName(msg.name), msg.text);
    };
    acts.querySelector(".copy-btn").onclick = function () {
      copyText(displayName(msg.name) + "：" + stripMark(msg.text));
    };
    acts.querySelector(".fwd-btn").onclick = function () {
      var input = $("msg-input");
      input.value = msg.text;
      setType(msg.type === "question" ? "question" : (msg.type === "answer" ? "answer" : "normal"));
      $("char-num").textContent = input.value.length;
      input.focus();
      updatePreview();
      toast("已放入编辑框，可修改后发送");
    };
  }
  /* 点击消息气泡切换显示操作按钮（触屏无 hover） */
  div.addEventListener("click", function () {
    if (!S.isTeacher || msg.type === "file" || msg.type === "image") return;
    var on = div.classList.contains("acts-on");
    var olds = list.querySelectorAll(".msg.acts-on");
    for (var k = 0; k < olds.length; k++) olds[k].classList.remove("acts-on");
    if (!on) div.classList.add("acts-on");
  });

  list.appendChild(div);
  trimDom();
  autoScroll();
}
/* 文件卡片 HTML（uploading=true 显示进度条） */
function fileCardHtml(f, uploading, icoSvg) {
  var dl = FILE_DL + f.uid + "/" + encodeURIComponent(f.name);
  var inner;
  if (uploading) {
    inner =
      '<div class="file-info">' +
        '<div class="file-name">' + esc(f.name) + "</div>" +
        '<div class="file-sub" data-role="pct">0%</div>' +
        '<div class="fprog"><em data-role="bar"></em></div>' +
      "</div>";
  } else {
    inner =
      '<div class="file-info">' +
        '<div class="file-name">' + esc(f.name) + "</div>" +
        '<div class="file-sub">' + fmtSize(f.size) + " · 点击下载</div>" +
      "</div>" +
      '<a class="fbtn" href="' + dl + '" target="_blank" rel="noopener">下载</a>' +
      (S.isTeacher ? '<button class="fdel" type="button">撤下</button>' : "");
  }
  return '<div class="file-card"><div class="file-ico">' + icoSvg + "</div>" + inner + "</div>";
}
/* 图片气泡 HTML（uploading=true 显示进度条；下载链接直指文件服务） */
function imageBubbleHtml(msg) {
  if (msg.uploading) {
    return (
      '<div class="img-bubble">' +
        '<div class="img-up">🖼 ' + esc(msg.file.name) + " 上传中…</div>" +
        '<div class="file-sub" data-role="pct">0%</div>' +
        '<div class="fprog"><em data-role="bar"></em></div>' +
      "</div>"
    );
  }
  var url = FILE_DL + msg.file.uid + "/" + encodeURIComponent(msg.file.name);
  return (
    '<div class="img-bubble">' +
      '<a href="' + url + '" class="lb-link">' +
        '<img src="' + url + '" alt="' + esc(msg.file.name) + '" loading="lazy">' +
      "</a>" +
      (msg.text ? '<div class="img-cap">' + esc(msg.text) + "</div>" : "") +
    "</div>"
  );
}
/* ---------- 图片全屏预览（Lightbox）：滚轮/捏合缩放、拖动平移、双击复位 ---------- */
var LB = { s: 1, x: 0, y: 0, drag: null, ptrs: {}, pinch: 0, pinchS: 1, mask: null };
function lbApply() {
  LB.s = Math.min(8, Math.max(0.2, LB.s));
  $("lb-img").style.transform = "translate(" + LB.x + "px," + LB.y + "px) scale(" + LB.s + ")";
  $("lb-pct").textContent = Math.round(LB.s * 100) + "%";
}
/* 以 (cx,cy) 为锚点缩放：保持锚点下的图像内容不动 */
function lbZoomAt(f, cx, cy) {
  var r = $("lightbox").getBoundingClientRect();
  var k = Math.min(8, Math.max(0.2, LB.s * f)) / LB.s;
  LB.x = (cx - r.width / 2) * (1 - k) + LB.x * k;
  LB.y = (cy - r.height / 2) * (1 - k) + LB.y * k;
  LB.s *= k;
  lbApply();
}
function lbOpen(src, dl) {
  $("lb-img").src = src;
  var a = $("lb-dl");
  a.href = dl || src;
  a.setAttribute("download", "");
  LB.s = 1; LB.x = 0; LB.y = 0;
  $("lightbox").hidden = false;
  lbApply();
}
function lbClose() {
  $("lightbox").hidden = true;
  $("lb-img").src = "";
  LB.drag = null; LB.ptrs = {}; LB.mask = null;
}
function initLightbox() {
  var box = $("lightbox"), img = $("lb-img");
  if (!box) return;
  /* 点击对话中的图片打开预览（事件委托，历史消息同样生效） */
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a.lb-link") : null;
    if (!a) return;
    e.preventDefault();
    lbOpen(a.href, a.href);
  });
  $("lb-zin").onclick = function () { lbZoomAt(1.25, innerWidth / 2, innerHeight / 2); };
  $("lb-zout").onclick = function () { lbZoomAt(0.8, innerWidth / 2, innerHeight / 2); };
  $("lb-reset").onclick = function () { LB.s = 1; LB.x = 0; LB.y = 0; lbApply(); };
  $("lb-close").onclick = lbClose;
  box.addEventListener("wheel", function (e) {
    e.preventDefault();
    lbZoomAt(e.deltaY < 0 ? 1.15 : 0.87, e.clientX, e.clientY);
  }, { passive: false });
  box.addEventListener("pointerdown", function (e) {
    LB.mask = null;
    if (e.target.closest(".lb-bar")) return;   // 按钮栏：不捕获指针，click 才能正常派发到按钮
    LB.mask = (e.target === box) ? { x: e.clientX, y: e.clientY } : null;  // 按在遮罩上且几乎没移动 → 关闭
    LB.ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var n = Object.keys(LB.ptrs).length;
    if (n === 1) {
      LB.drag = { sx: e.clientX - LB.x, sy: e.clientY - LB.y };
    } else if (n === 2) {
      LB.drag = null;
      var p = [];
      for (var k in LB.ptrs) p.push(LB.ptrs[k]);
      LB.pinch = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      LB.pinchS = LB.s;
    }
    if (box.setPointerCapture) try { box.setPointerCapture(e.pointerId); } catch (err) {}
  });
  box.addEventListener("pointermove", function (e) {
    if (!LB.ptrs[e.pointerId]) return;
    LB.ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var n = Object.keys(LB.ptrs).length;
    if (n === 2) {                                   // 双指捏合缩放（以视口中心为锚）
      var p = [];
      for (var k in LB.ptrs) p.push(LB.ptrs[k]);
      var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      if (LB.pinch > 0) { LB.s = LB.pinchS * d / LB.pinch; lbApply(); }
    } else if (n === 1 && LB.drag) {                 // 单指 / 鼠标拖动平移
      LB.x = e.clientX - LB.drag.sx;
      LB.y = e.clientY - LB.drag.sy;
      lbApply();
    }
  });
  function endPtr(e) {
    if (LB.mask && Math.hypot(e.clientX - LB.mask.x, e.clientY - LB.mask.y) < 6) { lbClose(); return; }
    delete LB.ptrs[e.pointerId];
    if (Object.keys(LB.ptrs).length === 0) LB.drag = null;
    if (Object.keys(LB.ptrs).length === 1) {         // 捏合抬一指：回到拖动态
      var p = [];
      for (var k in LB.ptrs) p.push(LB.ptrs[k]);
      LB.drag = { sx: p[0].x - LB.x, sy: p[0].y - LB.y };
    }
  }
  box.addEventListener("pointerup", endPtr);
  box.addEventListener("pointercancel", endPtr);
  img.addEventListener("dblclick", function () { LB.s = 1; LB.x = 0; LB.y = 0; lbApply(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("lightbox").hidden) lbClose();
  });
}

/* ---------- 公告 ---------- */
/* 关键机制：服务器不保存房间状态，迟到者收不到之前发的公告。
   所以教师端一旦看到新成员加入（joined），自动把当前公告重发一次，
   迟到者入房约 1 秒后即可看到置顶公告。同一成员只重发一次。 */
function maybeReplayNotice(name) {
  if (!S.isTeacher || !S.notice) return;
  if (S.replayedTo[name]) return;
  S.replayedTo[name] = true;
  setTimeout(function () {
    if (S.ws && S.ws.readyState === 1) {
      var npre = S.noticeColor ? ("\u200bC" + S.noticeColor + "\u200b") : "";
      safeSend({ type: "message", data: { message: MARK_A + npre + S.notice, time: Date.now() } });
    }
  }, 1000);
}
function renderNotice(alsoToast) {
  /* 教师：公告显示与编辑合并为同一个文本框（编辑框内容即当前公告，节约空间）；
     学生：仍走置顶公告条 */
  if (S.isTeacher) {
    var ta = $("notice-input");
    if (document.activeElement !== ta) ta.value = S.notice; // 正在输入时不覆盖
    ta.style.color = S.noticeColor || "";
    setDot($("btn-notice-color"), S.noticeColor || "");
    if (alsoToast) toast(S.notice ? "收到新公告" : "公告已被撤下");
    return;
  }
  var bar = $("notice-bar");
  if (S.notice) {
    var nt = $("notice-text");
    nt.innerHTML = renderRich(S.notice);        // 公告支持行内着色（renderRich 先 esc 防注入）
    nt.style.color = S.noticeColor || "";
    bar.classList.add("show");
    bar.classList.remove("folded");
    $("notice-fold").textContent = "收起";
    if (alsoToast) toast("收到新公告");
  } else {
    bar.classList.remove("show");
  }
}
function pinToScreen(name, text) {
  var content = "【上屏】" + name + "：" + stripMark(text);
  if (content.length > 280) content = content.slice(0, 280) + "…";
  if (safeSend({ type: "message", data: { message: MARK_A + content, time: Date.now() } })) {
    toast("已上屏到公告区");
  }
}

/* ---------- 进房流程 ---------- */
var pickTeacher = false;
function bindJoin() {
  $("role-student").onclick = function () {
    pickTeacher = false;
    this.classList.add("on"); $("role-teacher").classList.remove("on");
    $("teacher-key-wrap").style.display = "none";
  };
  $("role-teacher").onclick = function () {
    pickTeacher = true;
    this.classList.add("on"); $("role-student").classList.remove("on");
    $("teacher-key-wrap").style.display = "block";
  };
  $("btn-join").onclick = doJoin;
  $("in-key").addEventListener("keydown", function (e) { if (e.key === "Enter") doJoin(); });
  $("in-name").addEventListener("keydown", function (e) { if (e.key === "Enter") doJoin(); });
  $("in-room").addEventListener("keydown", function (e) { if (e.key === "Enter") $("in-name").focus(); });
  var rb = $("btn-rand-room");
  if (rb) rb.onclick = function () { $("in-room").value = randRoom(); $("join-err").textContent = ""; };

  /* URL 参数直达：?room=a1b2c&name=张三；无参数时回填最近一次的房间号/名字 */
  var q = new URLSearchParams(location.search);
  if (q.get("room")) $("in-room").value = q.get("room").replace(/[^a-zA-Z0-9]/g, "").slice(0, 5);
  else { try { $("in-room").value = localStorage.getItem("cr_room") || ""; } catch (e) {} }
  if (q.get("name")) $("in-name").value = q.get("name").slice(0, 12);
  else { try { $("in-name").value = localStorage.getItem("cr_name") || ""; } catch (e) {} }
}
function doJoin() {
  var room = $("in-room").value.trim().replace(/[^a-zA-Z0-9]/g, "");
  var name = $("in-name").value.trim();
  var err = $("join-err");
  err.textContent = "";
  if (!/^[a-zA-Z0-9]{5}$/.test(room)) { err.textContent = "房间号必须是 5 位字母或数字"; return; }
  if (!name) { err.textContent = "请填写名字"; return; }
  if (pickTeacher && $("in-key").value !== TEACHER_KEY) { err.textContent = "教师口令不正确"; return; }

  S.room = room;
  S.isTeacher = pickTeacher;
  S.name = pickTeacher ? (TEACHER_MARK + name) : name;   // 教师名加不可见前缀，全班可识别
  S.replayedTo = {};                                     // 公告重发记录（每次进房重置）
  S.fileReplayedTo = {};                                 // 文件重发记录
  S.fileCache = {};                                      // 文件缓存（进房后由 fileList 对账重建）
  try { localStorage.setItem("cr_name", name); localStorage.setItem("cr_room", room); } catch (e) {}

  $("view-join").style.display = "none";
  $("view-room").style.display = "flex";
  if (S.isTeacher) {
    document.body.classList.add("is-teacher");
    $("notice-edit").classList.add("show");
  }
  $("tb-room-id").textContent = room;
  loadHistory();
  /* 用本机历史回填文件缓存（教师刷新页面后仍能重发文件列表） */
  for (var fi = 0; fi < S.msgs.length; fi++) {
    var fm = S.msgs[fi];
    if (fm.type === "file" && fm.file && !S.fileCache[fm.file.id]) {
      S.fileCache[fm.file.id] = {
        id: fm.file.id, name: fm.file.name, size: fm.file.size,
        uid: fm.file.uid, username: displayName(fm.name)
      };
    }
  }
  renderNotice(false);
  S.members = {};
  S.members[S.name] = true;
  renderMembers();
  /* 回放本机历史 */
  for (var i = 0; i < S.msgs.length; i++) renderMsg(S.msgs[i]);
  addSysMsg("房间号 " + room + "，把页面发给同学即可加入");
  connect();
}

      var st = input.selectionStart == null ? input.value.length : input.selectionStart;
      var en = input.selectionEnd == null ? st : input.selectionEnd;
      input.value = input.value.slice(0, st) + t + input.value.slice(en);
      $("char-num").textContent = input.value.length;

      navigator.clipboard.read().then(function (items) {
        var imgItem = null, imgType = "", txtItem = null;
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          for (var j = 0; j < it.types.length; j++) {
            var tp = it.types[j];
            if (!imgItem && tp.indexOf("image/") === 0) { imgItem = it; imgType = tp; }

          });

        }
        toast("剪贴板是空的");
      }).catch(function () { toast("读取剪贴板失败，请用 Ctrl+V"); });
      return;
    }
    if (!navigator.clipboard.readText) { toast("浏览器不支持一键粘贴，请用 Ctrl+V"); return; }

  function togglePop(btn, popId) {

  /* 从其他程序粘贴：带图片时确认后走发图链路；带 text/html 时提取颜色转为包裹标记 */
  input.addEventListener("paste", function (e) {
    var items = e.clipboardData && e.clipboardData.items;

function setFont(px) {
  S.fontSize = Math.max(14, Math.min(30, px));

function sendMsg() {
  var input = $("msg-input");
  var text = input.value.trim();
  if (!text) { toast("先输入内容再发送"); return; }
  var now = Date.now();
  if (now - S.lastSend < SEND_GAP) {
    toast("发送太频繁，休息 " + Math.ceil((SEND_GAP - (now - S.lastSend)) / 1000) + " 秒");
    return;
  }
  var payload = S.msgType === "question" ? (MARK_Q + text) : (S.msgType === "answer" ? (MARK_H + text) : text);
  payload = applyFilter(payload);
  if (!payload.replace(MARK_Q, "").replace(MARK_H, "").replace(/\u200bC#[0-9a-fA-F]{6}\u200b/g, "").trim()) {
    toast("内容已被敏感词全部过滤"); return;
  }
  var pre = S.msgColor ? ("\u200bC" + S.msgColor + "\u200b") : "";
  if (!safeSend({ type: "message", data: { message: pre + payload, time: now } })) return;
  S.lastSend = now;
  /* 本机立即回显；服务器实际会把消息回传给发送者，pushMsg 按 同名+同毫秒+同内容 去重防双条 */
  pushMsg({
    name: S.name, text: text, time: now, color: S.msgColor,
    type: S.msgType === "question" ? "question" : (S.msgType === "answer" ? "answer" : "normal")
  });
  input.value = "";
  $("char-num").textContent = "0";
  updatePreview();
  var list = $("msg-list");
  list.scrollTop = list.scrollHeight;   // 自己发言后必滚到底，翻看历史时也能立刻看到自己
  input.focus();
}

/* ---------- 文件上传 ---------- */
function sendFile(file) {
  if (!file) return;
  if (file.size > FILE_MAX) { toast("文件超过 80MB，暂不支持"); return; }
  if (!S.ws || S.ws.readyState !== 1) { toast("尚未连上服务器，稍候再试"); return; }
  var uid = rand16(), id = rand16();
  var msg = {
    type: "file", uploading: true, time: Date.now(), name: S.name,
    file: { id: id, name: file.name, size: file.size, uid: uid }
  };
  pushMsg(msg);

  var xhr = new XMLHttpRequest();
  xhr.open("PUT", FILE_UP + encodeURIComponent(uid + "/" + file.name));
  xhr.upload.onprogress = function (e) {
    if (!e.lengthComputable) return;
    var pct = Math.round(e.loaded / e.total * 100);
    var el = $("msg-list").querySelector('.msg[data-fid="' + id + '"]');
    if (!el) return;
    var p = el.querySelector('[data-role="pct"]'), b = el.querySelector('[data-role="bar"]');
    if (p) p.textContent = pct + "%";
    if (b) b.style.width = pct + "%";
  };
  xhr.onload = function () {
    /* 服务器成功时返回 "1" 或空串（与 TextSync 前端判定一致） */
    if (xhr.status >= 200 && xhr.status < 300 && (xhr.responseText === "" || xhr.responseText === "1")) {
      msg.uploading = false;
      saveHistory();
      var el = $("msg-list").querySelector('.msg[data-fid="' + id + '"]');
      if (el) {
        var card = el.querySelector(".file-card");
        if (card) card.outerHTML = fileCardHtml(msg.file, false, card.querySelector(".file-ico").innerHTML);
      }
      safeSend({ type: "addFile", data: { id: id, name: file.name, size: file.size, uid: uid, status: "success", username: S.name } });
      toast("文件发送成功");
    } else {
      removeFileCard(id);
      toast("上传失败（" + xhr.status + "）");
    }
  };
  xhr.onerror = function () { removeFileCard(id); toast("上传失败，请检查网络"); };
  xhr.ontimeout = function () { removeFileCard(id); toast("上传超时"); };
  xhr.send(file);
}

/* ---------- 图片消息（全员可发；不进文件列表，只以消息形式广播） ---------- */
function sendImage(file) {
  if (!file) return;
  if (file.size > IMG_MAX) { toast("图片超过 10MB，请压缩后再发"); return; }
  if (!S.ws || S.ws.readyState !== 1) { toast("尚未连上服务器，稍候再试"); return; }
  if (/^image\/(jpeg|png)$/.test(file.type) && file.size > 2 * 1024 * 1024) {
    compressImage(file, 1600, 0.85, function (blob, fname) { go(blob || file, fname || file.name); });
  } else {
    go(file, file.name);
  }
  function go(blob, fname) {
    var uid = rand16(), id = uid;   // id=uid：与服务器 echo 的 file.id 对齐，配合 pushMsg 去重防发送端双图
    var msg = {
      type: "image", uploading: true, time: Date.now(), name: S.name, color: S.msgColor,
      text: "", file: { id: id, name: fname, size: blob.size, uid: uid }
    };
    pushMsg(msg);
    var xhr = new XMLHttpRequest();
    xhr.open("PUT", FILE_UP + encodeURIComponent(uid + "/" + fname));
    xhr.upload.onprogress = function (e) {
      if (!e.lengthComputable) return;
      var pct = Math.round(e.loaded / e.total * 100);
      var el = $("msg-list").querySelector('.msg[data-fid="' + id + '"]');
      if (!el) return;
      var p = el.querySelector('[data-role="pct"]'), b = el.querySelector('[data-role="bar"]');
      if (p) p.textContent = pct + "%";
      if (b) b.style.width = pct + "%";
    };
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300 && (xhr.responseText === "" || xhr.responseText === "1")) {
        msg.uploading = false;
        saveHistory();
        var el = $("msg-list").querySelector('.msg[data-fid="' + id + '"]');
        if (el) {
          var bub = el.querySelector(".img-bubble");
          if (bub) bub.outerHTML = imageBubbleHtml(msg);
        }
        /* 广播图片消息：\u200bIMG\u200buid\u200benc文件名\u200b（正文留空） */
        var pre = S.msgColor ? ("\u200bC" + S.msgColor + "\u200b") : "";
        safeSend({ type: "message", data: { message: pre + MARK_IMG + uid + "\u200b" + encodeURIComponent(fname) + "\u200b", time: Date.now() } });
        toast("图片发送成功");
      } else {
        removeFileCard(id);
        toast("图片上传失败（" + xhr.status + "）");
      }
    };
    xhr.onerror = function () { removeFileCard(id); toast("图片上传失败，请检查网络"); };
    xhr.ontimeout = function () { removeFileCard(id); toast("图片上传超时"); };
    xhr.send(blob);
  }
}
/* 大图压缩：canvas 重绘为 JPEG（长边 maxSide，质量 q），失败或更大则用原图 */
function compressImage(file, maxSide, q, done) {
  var img = new Image();
  var url = URL.createObjectURL(file);
  img.onload = function () {
    URL.revokeObjectURL(url);
    try {
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, maxSide / Math.max(w, h));
      var cv = document.createElement("canvas");
      cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(function (blob) {
        if (blob && blob.size < file.size) {
          var base = file.name.replace(/\.[^.]+$/, "");
          done(blob, base + "-压缩.jpg");
        } else done(null, null);
      }, "image/jpeg", q);
    } catch (e) { done(null, null); }
  };
  img.onerror = function () { URL.revokeObjectURL(url); done(null, null); };
  img.src = url;
}

/* ---------- 启动 ---------- */
loadLS();
document.documentElement.style.setProperty("--msg-size", S.fontSize + "px");
bindJoin();
initLightbox();
bindRoom();
/* 恢复上次昵称 */
try {
  var last = localStorage.getItem("cr_name");
  if (last) $("in-name").value = last;
} catch (e) {}
/* 页面重新可见时立即尝试重连 */
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && S.room && !S.wsOk) { S.retry = 0; connect(); }
});
